        });
      }

      // Page Visibility API to pause animations when tab is hidden
      (function () {
        var ambient = document.querySelector('.csa-ambient');
        if (!ambient) return;
        document.addEventListener('visibilitychange', function () {
          if (document.hidden) {
            ambient.classList.add('csa-paused');
          } else {
            ambient.classList.remove('csa-paused');
          }
        }, { passive: true });
      })();
    </script>
  </body>
</html>
